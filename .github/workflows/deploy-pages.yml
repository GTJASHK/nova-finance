name: Deploy GitHub Pageson:  push:    branches: [main]  workflow_dispatch:permissions:  contents: read  pages: write  id-token: writeconcurrency:  group: pages  cancel-in-progress: falsejobs:  deploy:    environment:      name: github-pages      url: ${{ steps.deployment.outputs.page_url }}    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - uses: actions/configure-pages@v5      - name: Build public site        run: |          mkdir -p _site          cp index.html app.js styles.css _site/          printf "window.NOVA_API_BASE_URL = 'https://nova-finance-jxyhv4tb6-gg-g1.vercel.app';\n" > _site/config.js      - uses: actions/upload-pages-artifact@v3        with:          path: _site      - id: deployment        uses: actions/deploy-pages@v4
